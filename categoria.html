<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
<header class="top">
  <a class="brand" href="index.html">The Fish Room 🐟</a>
  <nav class="nav" aria-label="Navegación principal">

</header>

<section class="category-hero">
  <div class="category-hero-inner"><span class="eyebrow">THE FISH ROOM · CATÁLOGO</span><h1 id="catTitle">Bettas</h1><p id="catDesc"></p></div>
</section>

<section class="section shop">
  <div class="section-head">
    <div><span class="eyebrow">CATÁLOGO</span><h2 id="catHeading">Productos</h2></div>
    <div class="tools"><input id="search" placeholder="🔎 Buscar..." aria-label="Buscar producto"><select id="sort"><option value="featured">Destacados</option><option value="priceAsc">Precio menor</option><option value="priceDesc">Precio mayor</option><option value="name">Nombre A-Z</option></select></div>
  </div>
  <div class="chips category-links">
    <a class="chip" href="categoria.html?c=Bettas">Bettas</a>
    <a class="chip" href="categoria.html?c=Guppys">Guppys</a>
    <a class="chip" href="categoria.html?c=Cíclidos">Cíclidos</a>
    <a class="chip" href="categoria.html?c=Plantas">Plantas</a>
    <a class="chip" href="categoria.html?c=Material">Material</a>
  </div>
  <div id="products" class="products"></div>
</section>

<div id="drawer" class="drawer"><div class="drawer-card"><button class="close" onclick="closeDrawer()">✕</button><div id="drawerContent"></div></div></div>

<script>
const c=new URLSearchParams(location.search).get("c")||"Bettas";
window.TFR_CATEGORY=c;
const labels={
  Bettas:["Bettas","Betta Koi, Corona, Rosa y nuevas variedades."],
  Guppys:["Guppys","Guppys variados y nuevas líneas."],
  "Cíclidos":["Cíclidos","Polar Blue y otras variedades."],
  Plantas:["Plantas","Plantas naturales, musgos y flotantes."],
  Material:["Material y accesorios","Filtración, iluminación y accesorios."],
  Estanques:["Estanques","Koi, goldfish y accesorios."]
};
const info=labels[c]||[c,"Productos The Fish Room"];
document.getElementById("catTitle").textContent=info[0];
document.getElementById("catHeading").textContent=info[0];
document.getElementById("catDesc").textContent=info[1];
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="data.js"></script><script src="app.js"></script>
</body>
</html>
