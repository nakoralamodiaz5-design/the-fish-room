<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Fish Room | Catálogo</title>
<link rel="stylesheet" href="style.css">
<style>
.category-hero{padding:58px 6%;background:linear-gradient(110deg,#041a24,#062d3a);border-bottom:1px solid #144655}
.category-hero h1{font-size:46px;margin:8px 0}
.category-hero p{color:#abc1c8;max-width:720px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">The Fish Room <span>🐟</span></a>
  <nav class="nav">
    <a href="categoria.html?c=Bettas">Peces</a>
    <a href="categoria.html?c=Plantas">Plantas</a>
    <a href="categoria.html?c=Cíclidos">Cíclidos</a>
    <a href="index.html#equipamiento">Material</a>
    <a href="index.html#servicios">Servicios</a>
    <a href="index.html#contacto">Contacto</a>
  </nav>
  <div class="head-actions">
    <a class="iconbtn" href="index.html">🏠</a>
    <button class="iconbtn" type="button" id="cartBtn">🛒 <b id="cartCount">0</b></button>
  </div>
</header>

<section class="category-hero">
  <span class="eyebrow">THE FISH ROOM · CATÁLOGO</span>
  <h1 id="title">Categoría</h1>
  <p id="desc"></p>
</section>

<section class="section">
  <div class="chips">
    <button class="chip" onclick="location.href='categoria.html?c=Bettas'">Bettas</button>
    <button class="chip" onclick="location.href='categoria.html?c=Guppys'">Guppys</button>
    <button class="chip" onclick="location.href='categoria.html?c=Cíclidos'">Cíclidos</button>
    <button class="chip" onclick="location.href='categoria.html?c=Plantas'">Plantas</button>
  </div>
  <div class="products" id="products"></div>
</section>

<div id="drawer" class="drawer">
  <div class="drawer-card">
    <button class="close" type="button" onclick="closeDrawer()">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<script>
const category = new URLSearchParams(location.search).get("c") || "Bettas";
window.TFR_CATEGORY = category;

const meta = {
  Bettas:["Bettas","Betta Koi, Corona, Rosa y nuevas variedades."],
  Guppys:["Guppys","Guppys variados y nuevas líneas según disponibilidad."],
  Cíclidos:["Cíclidos","Polar Blue y otras variedades de cíclidos."],
  Plantas:["Plantas","Plantas naturales, musgos y flotantes."],
  Material:["Material y accesorios","Filtración, iluminación, calentadores, decoración y más."],
  Estanques:["Estanques","Koi y accesorios para estanques."],
  Acuarios:["Acuarios","Acuarios y soluciones para montar tu proyecto."]
};
document.getElementById("title").textContent = meta[category]?.[0] || category;
document.getElementById("desc").textContent = meta[category]?.[1] || "Productos de The Fish Room.";
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
