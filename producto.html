<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ficha de producto | The Fish Room">
<title>The Fish Room | Producto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">The Fish Room <span>🐟</span></a>
  <nav class="nav">
    <a href="categoria.html?c=Bettas">Peces</a><a href="categoria.html?c=Plantas">Plantas</a>
    <a href="categoria.html?c=Material">Material</a><a href="index.html#servicios">Servicios</a><a href="index.html#contacto">Contacto</a>
  </nav>
  <div class="head-actions"><button class="iconbtn" id="cartBtn" type="button">🛒 <b id="cartCount">0</b></button></div>
</header>

<main class="detail-page">
  <div class="breadcrumbs"><a href="index.html">Inicio</a> / <span id="crumb">Producto</span></div>
  <section class="product-detail" id="detail"></section>
  <section class="related section" id="related"></section>
</main>

<div id="drawer" class="drawer"><div class="drawer-card"><button class="close" type="button" onclick="closeDrawer()">✕</button><div id="drawerContent"></div></div></div>

<script src="data.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const products = window.TFR_PRODUCTS || [];
const p = products.find(x => x.id === id) || products[0];

if (!p) {
  document.getElementById("detail").innerHTML = '<div class="empty">No hay productos disponibles.</div>';
} else {
  document.title = `The Fish Room | ${p.name}`;
  document.getElementById("crumb").textContent = p.name;

  const stock = Number(p.stock);
  const stockClass = stock > 0 ? (stock <= 2 ? "low" : "ok") : "off";
  const stockText = stock > 0 ? (stock <= 2 ? `Últimas ${stock}` : "Consultar disponibilidad") : "Agotado";

  const wa = "https://wa.me/34612412469?text=" + encodeURIComponent(
    "Hola The Fish Room, me interesa " + p.name + ". ¿Sigue disponible?"
  );

  document.getElementById("detail").innerHTML = `
    <div class="detail-image"><img src="${p.image}" alt="${p.name}"></div>
    <div class="detail-copy">
      <span class="tag">${p.category.toUpperCase()}</span>
      <h1>${p.name}</h1>
      <p class="detail-desc">${p.description}</p>
      <div class="detail-price">${Number(p.price).toFixed(2).replace(".",",")} € <small>/ ${p.unit || "unidad"}</small></div>
      <div class="detail-stock ${stockClass}">● ${stockText}</div>
      <div class="detail-note">Las cantidades de animales vivos se confirman antes de cerrar el pedido.</div>
      <div class="detail-actions">
        <button class="btn" ${stockClass === "off" ? "disabled" : ""} onclick="addCart('${p.id}')">🛒 Añadir al carrito</button>
        <button class="btn ghost" onclick="reserve()">⏱️ Solicitar reserva 24 h</button>
        <a class="btn ghost" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>
        <button class="btn ghost" type="button" onclick="openCart()">🛒 Ver carrito</button>
      </div>
      <div class="detail-info">
        <div><b>Recogida</b><span>En tienda · Santa María de Guía</span></div>
        <div><b>Pagos</b><span>Online y en tienda cuando el sistema esté conectado</span></div>
        <div><b>Atención</b><span>612 412 469 · @thefishroomm</span></div>
      </div>
    </div>
  `;

  function reserve() {
    const reservations = JSON.parse(localStorage.getItem("tfr_reservations") || "[]");
    reservations.push({
      id: p.id, name: p.name,
      createdAt: new Date().toISOString(),
      expiresAt: new Date(Date.now() + 24*60*60*1000).toISOString()
    });
    localStorage.setItem("tfr_reservations", JSON.stringify(reservations));
    location.href = "https://wa.me/34612412469?text=" + encodeURIComponent(
      "Hola The Fish Room, quiero reservar durante 24 horas: " + p.name + "."
    );
  }
  window.reserve = reserve;

  const related = products.filter(x => x.category === p.category && x.id !== p.id).slice(0,3);
  document.getElementById("related").innerHTML = related.length ? `
    <div class="section-head center"><span class="eyebrow">TAMBIÉN TE PUEDE INTERESAR</span><h2>Productos relacionados</h2></div>
    <div class="products">
      ${related.map(x => `
        <article class="product">
          <a class="photo" href="producto.html?id=${encodeURIComponent(x.id)}" style="background-image:url('${x.image}')"></a>
          <div class="pbody">
            <span class="tag">${x.category.toUpperCase()}</span>
            <h3>${x.name}</h3>
            <div class="price-row"><span class="price">${Number(x.price).toFixed(2).replace(".",",")} € / ${x.unit || "unidad"}</span></div>
            <a class="btn ghost" style="margin-top:12px;width:100%;text-align:center" href="producto.html?id=${encodeURIComponent(x.id)}">Ver producto</a>
          </div>
        </article>
      `).join("")}
    </div>` : "";
}
</script>
<script src="app.js"></script>
</body>
</html>
