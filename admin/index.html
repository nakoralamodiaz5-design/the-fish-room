<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | The Fish Room</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../index.html">The Fish Room 🐟</a><div style="margin-left:auto"><button id="logoutBtn" class="iconbtn" style="display:none">Cerrar sesión</button></div></header><main class="admin-page"><section id="loginBox" class="admin-card" style="max-width:560px;margin:50px auto"><span class="eyebrow">ADMINISTRACIÓN SEGURA</span><h1>Acceso</h1><form id="loginForm" class="admin-form"><label>Correo<input id="loginEmail" type="email" required></label><label>Contraseña<input id="loginPassword" type="password" required></label><button class="btn">Entrar</button><div id="loginMsg" class="muted"></div></form></section><section id="adminApp" style="display:none"><div class="section-head"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>The Fish Room</h1><div id="adminEmail" class="muted"></div></div><button class="btn ghost" id="refreshBtn">Actualizar</button></div><div class="admin-grid"><div class="admin-card admin-stat"><span class="muted">Productos</span><b id="sProducts">0</b></div><div class="admin-card admin-stat"><span class="muted">Pedidos</span><b id="sOrders">0</b></div><div class="admin-card admin-stat"><span class="muted">Reservas</span><b id="sReservations">0</b></div><div class="admin-card admin-stat"><span class="muted">Servicios</span><b id="sServices">0</b></div></div><div class="admin-nav"><button class="active" data-tab="productsTab">Productos</button><button data-tab="ordersTab">Pedidos</button><button data-tab="reservationsTab">Reservas</button><button data-tab="servicesTab">Servicios</button></div><section id="productsTab" class="admin-section active"><div class="admin-card"><h2>Añadir / editar producto</h2><form id="productForm" class="admin-form"><input id="editId" type="hidden"><div class="admin-two"><label>Nombre<input id="pName" required></label><label>Categoría<select id="pCategory"><option>Bettas</option><option>Guppys</option><option>Cíclidos</option><option>Plantas</option><option>Acuarios</option><option>Material</option><option>Filtración</option><option>Iluminación</option><option>Alimentación</option><option>Decoración</option><option>Accesorios</option><option>Estanques</option></select></label></div><div class="admin-two"><label>Precio<input id="pPrice" type="number" min="0" step="0.01" required></label><label>Stock<input id="pStock" type="number" min="0" required></label></div><div class="admin-two"><label>Unidad<input id="pUnit" value="unidad"></label><label>Imagen<input id="pImage"></label></div><label>Descripción<textarea id="pDescription" rows="3"></textarea></label><div class="admin-actions"><button class="btn">Guardar</button><button class="btn ghost" id="cancelEdit" type="button">Cancelar</button></div></form></div><div class="admin-card" style="margin-top:18px"><h2>Catálogo</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><section id="ordersTab" class="admin-section"><div class="admin-card"><h2>Pedidos</h2><div id="orders"></div></div></section><section id="reservationsTab" class="admin-section"><div class="admin-card"><h2>Reservas</h2><div id="reservations"></div></div></section><section id="servicesTab" class="admin-section"><div class="admin-card"><h2>Servicios</h2><div id="services"></div></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>const sb=window.supabase.createClient(window.TFR_SUPABASE_URL,window.TFR_SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s);let products=[];async function adminUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function boot(){const u=await adminUser();if(!u){loginBox.style.display='block';adminApp.style.display='none';return}loginBox.style.display='none';adminApp.style.display='block';logoutBtn.style.display='inline-block';adminEmail.textContent=u.email||'';await load()}async function load(){const [p,o,r,s]=await Promise.all([sb.from('products').select('*').eq('active',true).order('name'),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('reservations').select('*').order('created_at',{ascending:false}),sb.from('service_requests').select('*').order('created_at',{ascending:false})]);if(p.error||o.error||r.error||s.error)return alert('Error cargando datos: '+(p.error||o.error||r.error||s.error).message);products=p.data||[];sProducts.textContent=products.length;sOrders.textContent=(o.data||[]).length;sReservations.textContent=(r.data||[]).length;sServices.textContent=(s.data||[]).length;rows.innerHTML=products.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>${Number(x.price).toFixed(2)} €</td><td>${x.stock}</td><td>${Number(x.stock)>0?'Disponible':'Agotado'}</td><td><button onclick="editProduct('${x.id}')">Editar</button> <button onclick="toggleStock('${x.id}')">${Number(x.stock)>0?'Agotar':'Reponer'}</button></td></tr>`).join('');orders.innerHTML=(o.data||[]).map(x=>`<div class="admin-card" style="margin-bottom:12px"><b>${x.order_number}</b> · ${x.status}<p>${x.customer_name} · ${x.customer_phone} · ${x.customer_email}</p><p>Recogida: ${x.pickup_date} ${x.pickup_time} · <b>${Number(x.total).toFixed(2)} €</b></p></div>`).join('')||'<div class="empty">No hay pedidos.</div>';reservations.innerHTML=(r.data||[]).map(x=>`<div class="admin-card" style="margin-bottom:12px"><b>${x.product_name}</b> · ${x.customer_name||'Sin nombre'} · ${x.status}<p>Caduca: ${new Date(x.expires_at).toLocaleString('es-ES')}</p></div>`).join('')||'<div class="empty">No hay reservas.</div>';services.innerHTML=(s.data||[]).map(x=>`<div class="admin-card" style="margin-bottom:12px"><b>${x.service}</b> · ${x.request_type}<p>${x.customer_name} · ${x.customer_phone}</p><p>${x.requested_date} ${x.requested_time}</p><p>${x.description||''}</p></div>`).join('')||'<div class="empty">No hay solicitudes.</div>'}window.editProduct=id=>{const x=products.find(p=>p.id===id);if(!x)return;editId.value=x.id;pName.value=x.name;pCategory.value=x.category;pPrice.value=x.price;pStock.value=x.stock;pUnit.value=x.unit||'unidad';pImage.value=x.image||'';pDescription.value=x.description||'';scrollTo({top:0,behavior:'smooth'})};window.toggleStock=async id=>{const x=products.find(p=>p.id===id);if(!x)return;const {error}=await sb.from('products').update({stock:Number(x.stock)>0?0:1}).eq('id',id);if(error)alert(error.message);else load()};loginForm.addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error)loginMsg.textContent=error.message;else boot()});cancelEdit.addEventListener('click',()=>{productForm.reset();editId.value='';pUnit.value='unidad'});productForm.addEventListener('submit',async e=>{e.preventDefault();const payload={id:editId.value||'p'+Date.now(),name:pName.value.trim(),category:pCategory.value,price:Number(pPrice.value),stock:Number(pStock.value),unit:pUnit.value.trim()||'unidad',image:pImage.value.trim(),description:pDescription.value.trim(),featured:false,active:true};const {error}=await sb.from('products').upsert(payload,{onConflict:'id'});if(error)alert(error.message);else{cancelEdit.click();load()}});document.querySelectorAll('.admin-nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.admin-nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.admin-section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$( '#'+b.dataset.tab).classList.add('active')}));refreshBtn.addEventListener('click',load);logoutBtn.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});boot();</script></body></html>
