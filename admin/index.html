<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | The Fish Room</title><link rel="stylesheet" href="../style.css"></head><body>
<header class="top"><a class="brand" href="../index.html">The Fish Room 🐟</a><div style="margin-left:auto"><button id="logout" class="iconbtn" style="display:none">Cerrar sesión</button></div></header>
<main class="section">
<section id="loginBox" class="box" style="max-width:520px;margin:60px auto"><span class="eyebrow">ADMINISTRACIÓN</span><h1>Acceso</h1><form id="loginForm"><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button class="btn" type="submit">Entrar</button><p id="loginMsg" class="muted"></p></form></section>
<section id="adminApp" style="display:none">
<div class="section-head"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>The Fish Room</h1></div><button id="refresh" class="btn ghost">Actualizar</button></div>
<div class="products" style="grid-template-columns:repeat(4,1fr);margin-bottom:25px"><div class="box"><b>Productos</b><div id="sProducts">0</div></div><div class="box"><b>Pedidos</b><div id="sOrders">0</div></div><div class="box"><b>Reservas</b><div id="sReservations">0</div></div><div class="box"><b>Servicios</b><div id="sServices">0</div></div></div>
<div class="box" style="margin-bottom:20px"><h2>Añadir / editar producto</h2><form id="productForm"><input id="id" type="hidden"><div class="two"><label>Nombre<input id="name" required></label><label>Categoría<input id="category" required></label></div><div class="two"><label>Precio<input id="price" type="number" step="0.01" min="0" required></label><label>Stock<input id="stock" type="number" min="0" required></label></div><div class="two"><label>Unidad<input id="unit" value="unidad"></label><label>Imagen<input id="image"></label></div><label>Descripción<textarea id="description"></textarea></label><div><button class="btn">Guardar producto</button></div></form></div>
<div class="box"><h2>Catálogo</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px">Producto</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="box" style="margin-top:20px"><h2>Pedidos</h2><div id="orders"></div></div>
<div class="box" style="margin-top:20px"><h2>Reservas</h2><div id="reservations"></div></div>
<div class="box" style="margin-top:20px"><h2>Servicios</h2><div id="services"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
const sb=window.supabase.createClient(window.TFR_SUPABASE_URL,window.TFR_SUPABASE_PUBLISHABLE_KEY);let products=[];
async function checkAdmin(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){loginBox.style.display="block";adminApp.style.display="none";return false;}
 const {data}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(!data){loginBox.innerHTML='<div class="eyebrow">SIN PERMISOS</div><h2>Usuario sin acceso</h2><p class="muted">Este usuario existe, pero no está en admin_users.</p>';return false;}
 loginBox.style.display="none";adminApp.style.display="block";logout.style.display="inline-block";return true;
}
async function load(){
 const [p,o,r,s]=await Promise.all([
  sb.from("products").select("*").eq("active",true).order("name"),
  sb.from("orders").select("*").order("created_at",{ascending:false}),
  sb.from("reservations").select("*").order("created_at",{ascending:false}),
  sb.from("service_requests").select("*").order("created_at",{ascending:false})
 ]);
 if(p.error||o.error||r.error||s.error)return alert("Error cargando datos.");
 products=p.data||[];sProducts.textContent=products.length;sOrders.textContent=(o.data||[]).length;sReservations.textContent=(r.data||[]).length;sServices.textContent=(s.data||[]).length;
 rows.innerHTML=products.map(x=>`<tr><td style="padding:10px">${x.name}</td><td>${Number(x.price).toFixed(2)} €</td><td>${x.stock}</td><td><button onclick="editP('${x.id}')">Editar</button><button onclick="stock0('${x.id}')">Agotar</button></td></tr>`).join("");
 orders.innerHTML=(o.data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #173c49"><b>${x.order_number}</b> · ${x.customer_name} · ${x.customer_phone}<br>${x.pickup_date} ${x.pickup_time} · ${Number(x.total).toFixed(2)} €</div>`).join("")||"No hay pedidos.";
 reservations.innerHTML=(r.data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #173c49"><b>${x.product_name}</b> · ${x.customer_name||"Sin nombre"} · ${x.status}</div>`).join("")||"No hay reservas.";
 services.innerHTML=(s.data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #173c49"><b>${x.service}</b> · ${x.customer_name} · ${x.requested_date} ${x.requested_time}</div>`).join("")||"No hay solicitudes.";
}
window.editP=(id)=>{const x=products.find(p=>p.id===id);if(!x)return;id.value=x.id;name.value=x.name;category.value=x.category;price.value=x.price;stock.value=x.stock;unit.value=x.unit||"unidad";image.value=x.image||"";description.value=x.description||"";scrollTo({top:0,behavior:"smooth"});}
window.stock0=async(id)=>{const {error}=await sb.from("products").update({stock:0}).eq("id",id);if(error)alert(error.message);else load();}
loginForm.addEventListener("submit",async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginMsg.textContent=error.message;return;}if(await checkAdmin())load();});
logout.addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});refresh.addEventListener("click",load);
productForm.addEventListener("submit",async e=>{e.preventDefault();const payload={id:id.value||"p"+Date.now(),name:name.value.trim(),category:category.value.trim(),price:Number(price.value),stock:Number(stock.value),unit:unit.value.trim()||"unidad",image:image.value.trim(),description:description.value.trim(),active:true,featured:false};const {error}=await sb.from("products").upsert(payload);if(error)alert(error.message);else{alert("Producto guardado.");productForm.reset();id.value="";unit.value="unidad";load();}});
(async()=>{if(await checkAdmin())load();})();
</script></body></html>
